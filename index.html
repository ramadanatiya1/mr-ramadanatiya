<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ / رمضان عطية | لوحة التحكم والمدير</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --bg: #0b0d16;
            --card-bg: #131c31;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        body.light-mode {
            --primary: #f1f5f9;
            --secondary: #ffffff;
            --accent: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.2);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            padding: 15px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header { 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .header h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .theme-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        .container {
            margin-top: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="theme-btn" onclick="toggleTheme()">مظلم / فاتح 🌙</button>
        <h1>منصة الأستاذ / رمضان عطية</h1>
        <p>عملاق الجغرافيا السياسية والتاريخ للبكالوريا</p>
    </div>

    <div class="container">
        <h3>الجغرافيا السياسية 🌍</h3>
        <p>أهلاً بك يا بطل في لوحة التحكم والمنصة التعليمية. الزرار شغال وجاهز!</p>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
