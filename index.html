<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ رمضان عطية | لوحة التحكم والسيادة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --input-bg: rgba(3, 7, 18, 0.9);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
        }

        body.light-mode {
            --bg-deep: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(241, 245, 249, 0.9);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        }

        body.history-theme { --accent: #eab308; --accent-glow: rgba(234, 179, 8, 0.4); }
        body.geo-theme { --accent: #0ea5e9; --accent-glow: rgba(14, 165, 233, 0.4); }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.4s ease;
        }

        .container { width: 100%; max-width: 600px; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-top: 3px solid var(--accent);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            font-family: 'Tajawal', sans-serif;
            color: var(--accent);
            text-align: center;
            margin-top: 0;
            font-weight: 900;
        }

        p { color: var(--text-muted); text-align: center; font-size: 13px; }

        .tabs {
            display: flex; background: var(--input-bg); border-radius: 10px; padding: 4px; margin-bottom: 15px;
            border: 1px solid var(--card-border);
        }
        .tab {
            flex: 1; background: transparent; border: none; padding: 10px; color: var(--text-muted);
            font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px; transition: 0.3s;
        }
        .tab.active { background: var(--accent); color: #030712; box-shadow: 0 4px 12px var(--accent-glow); }

        .group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; color: var(--accent); margin-bottom: 4px; font-family: 'Tajawal', sans-serif; font-weight: 700; text-align: right; }
        input, select {
            width: 100%; padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--card-border);
            color: var(--text-main); border-radius: 10px; font-size: 13px; font-family: 'Cairo', sans-serif; outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

        .main-btn {
            background: linear-gradient(135deg, var(--accent), #d97706); color: #030712; border: none; padding: 12px; width: 100%;
            border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: 'Tajawal', sans-serif; transition: 0.3s;
        }
        .main-btn:hover { opacity: 0.9; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-pill {
            background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
            padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 11px; font-family: 'Tajawal', sans-serif; font-weight: 700;
        }

        .table-container { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 10px; border-bottom: 1px solid var(--card-border); }
        th { color: var(--accent); font-family: 'Tajawal'; }
        
        .hidden { display: none !important; }
        .sub-link { color: var(--accent); text-align: center; font-size: 11px; cursor: pointer; margin-top: 8px; font-family: 'Tajawal'; display: block; font-weight: 600; }
    </style>
</head>
<body id="pageBody" class="history-theme">

    <div class="container">
        
        <div class="top-bar">
            <span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">منصة الأستاذ / رمضان عطية</span>
            <div>
                <button class="action-pill" onclick="toggleTheme()">💡 الثيم</button>
                <button class="action-pill" onclick="openAdminModal()">⚙️ لوحة الأدمن</button>
            </div>
        </div>

        <!-- بوابة الطلاب -->
        <div id="authBox" class="glass-card">
            <h2>بوابة الطلاب الذكية 🎓</h2>
            <p>سجل دخولك أو أنشئ حسابك الجديد للمتابعة</p>

            <div class="tabs">
                <button class="tab active" id="tabL" onclick="switchTab('login')">تسجيل الدخول 🔓</button>
                <button class="tab" id="tabR" onclick="switchTab('register')">طالب جديد 📝</button>
            </div>
            
            <div id="loginForm">
                <div class="group">
                    <label>رقم هاتف الطالب</label>
                    <input type="tel" id="lPhone" placeholder="010xxxxxxxx">
                </div>
                <div class="group">
                    <label>كلمة السر</label>
                    <input type="password" id="lPass" placeholder="أدخل كلمة السر">
                </div>
                <button class="main-btn" onclick="login()">دخول المنصة 🚀</button>
            </div>

            <div id="regForm" class="hidden">
                <div class="group">
                    <label>الاسم الكامل للطالب</label>
                    <input type="text" id="rName" placeholder="مثال: عمار رمضان">
                </div>
                <div class="group">
                    <label>رقم هاتف الطالب</label>
                    <input type="tel" id="rPhone" placeholder="010xxxxxxxx">
                </div>
                <div class="group">
                    <label>اسم ولي الأمر</label>
                    <input type="text" id="rPName" placeholder="اسم ولي الأمر رباعي">
                </div>
                <div class="group">
                    <label>رقم هاتف ولي الأمر</label>
                    <input type="tel" id="rPPhone" placeholder="011xxxxxxxx">
                </div>
                <div class="group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="rEmail" placeholder="example@gmail.com">
                </div>
                <div class="group">
                    <label>كلمة السر</label>
                    <input type="password" id="rPass" placeholder="اختر كلمة سر قوية">
                </div>
                <div class="group">
                    <label>المرحلة الدراسية</label>
                    <select id="rSubj">
                        <option value="history">التاريخ (نظام البكالوريا) 📜</option>
                        <option value="geo">الجغرافيا السياسية (الثانوية العامة) 🌍</option>
                    </select>
                </div>
                <button class="main-btn" onclick="register()">إنشاء الحساب ✨</button>
            </div>
        </div>

        <!-- منصة الطالب -->
        <div id="platformBox" class="hidden">
            <div class="glass-card" style="text-align: center;">
                <h1 id="pTitle" style="font-size: 20px;">منصة المواد الأدبية</h1>
                <div style="background: var(--input-bg); padding: 8px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                    <div>الطالب: <strong id="pName" style="color:var(--accent);"></strong></div>
                    <button onclick="location.reload()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold; font-family:'Tajawal';">خروج 🚪</button>
                </div>
            </div>
        </div>

        <!-- لوحة تحكم الأدمن الخاصة بك -->
        <div id="adminDashboard" class="glass-card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0; font-size:18px;">👑 لوحة تحكم الأستاذ رمضان</h2>
                <button onclick="closeAdminDashboard()" class="action-pill" style="color:#ef4444;">إغلاق ❌</button>
            </div>
            <p style="text-align:right;">قاعدة بيانات الطلاب المسجلين بالمنصة:</p>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الهاتف</th>
                            <th>المادة</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- البيانات هتتسحب هنا أوتوماتيك -->
                    </tbody>
                </table>
            </div>
            <button class="main-btn" style="margin-top:15px; background:#ef4444; color:#fff;" onclick="clearAllData()">حذف كافة بيانات الطلاب 🗑️</button>
        </div>

    </div>

    <!-- نافذة تسجيل دخول الأدمن المخفية -->
    <div id="adminModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div class="glass-card" style="width: 85%; max-width: 350px;">
            <h3>دخول الأدمن الخاص 🔐</h3>
            <p>أدخل كلمة مرور الأدمن السرية</p>
            <div class="group">
                <input type="password" id="adminSecretInput" placeholder="كلمة المرور المشفرة">
            </div>
            <button class="main-btn" onclick="verifyAdminLogin()">دخول للوحة التحكم 🚀</button>
            <button onclick="closeAdminModal()" style="background:none; border:none; color:#ef4444; width:100%; margin-top:10px; cursor:pointer; font-weight:bold; font-family:'Tajawal';">إلغاء</button>
        </div>
    </div>

    <script>
        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function switchTab(type) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('regForm').classList.add('hidden');
            document.getElementById('tabL').classList.remove('active');
            document.getElementById('tabR').classList.remove('active');

            if(type === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('tabL').classList.add('active');
            } else {
                document.getElementById('regForm').classList.remove('hidden');
                document.getElementById('tabR').classList.add('active');
            }
        }

        // نظام تخزين وحفظ الطلاب (قاعدة بيانات محلية مطورة، ويمكن ربطها بـ Supabase مستقبلاً)
        function getStudents() {
            return JSON.parse(localStorage.getItem('rt_all_students')) || [];
        }

        function register() {
            const name = document.getElementById('rName').value.trim();
            const phone = document.getElementById('rPhone').value.trim();
            const parentName = document.getElementById('rPName').value.trim();
            const parentPhone = document.getElementById('rPPhone').value.trim();
            const email = document.getElementById('rEmail').value.trim();
            const pass = document.getElementById('rPass').value.trim();
            const subj = document.getElementById('rSubj').value;

            if(!name || !phone || !pass) {
                alert('املأ الحقول الإجبارية!');
                return;
            }

            let students = getStudents();
            if(students.some(s => s.phone === phone)) {
                alert('رقم الهاتف مسجل مسبقاً!');
                return;
            }

            const newStudent = { name, phone, parentName, parentPhone, email, pass, subj };
            students.push(newStudent);
            localStorage.setItem('rt_all_students', JSON.stringify(students));
            localStorage.setItem('rt_current_student', JSON.stringify(newStudent));
            
            alert('تم إنشاء الحساب بنجاح!');
            launchPlatform(newStudent);
        }

        function login() {
            const phone = document.getElementById('lPhone').value.trim();
            const pass = document.getElementById('lPass').value.trim();
            let students = getStudents();

            const st = students.find(s => s.phone === phone && s.pass === pass);
            if(st) {
                localStorage.setItem('rt_current_student', JSON.stringify(st));
                launchPlatform(st);
            } else {
                alert('رقم الهاتف أو كلمة السر غير صحيحة!');
            }
        }

        function launchPlatform(st) {
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('platformBox').classList.remove('hidden');
            document.getElementById('pName').innerText = st.name;
        }

        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }
        function closeAdminDashboard() { document.getElementById('adminDashboard').classList.add('hidden'); document.getElementById('authBox').classList.remove('hidden'); }

        function verifyAdminLogin() {
            const key = document.getElementById('adminSecretInput').value.trim();
            // هنا الباسورد الخاص بك أنت وحدك (مثلاً رمضـان 2026 أو أي باسورد تحبه سري جداً)
            if(key === 'RamadanAtiya2026#') {
                closeAdminModal();
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('platformBox').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderAdminTable();
            } else {
                alert('كلمة مرور الأدمن غير صحيحة!');
            }
        }

        function renderAdminTable() {
            let students = getStudents();
            let tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if(students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">لا توجد تسجيلات حتى الآن</td></tr>`;
                return;
            }

            students.forEach((st, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${st.name}</td>
                        <td>${st.phone}</td>
                        <td>${st.subj === 'history' ? 'تاريخ' : 'جغرافيا'}</td>
                        <td><button onclick="deleteStudent(${index})" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button></td>
                    </tr>
                `;
            });
        }

        function deleteStudent(index) {
            let students = getStudents();
            students.splice(index, 1);
            localStorage.setItem('rt_all_students', JSON.stringify(students));
            renderAdminTable();
        }

        function clearAllData() {
            if(confirm('هل أنت متأكد من حذف جميع بيانات الطلاب؟')) {
                localStorage.removeItem('rt_all_students');
                renderAdminTable();
            }
        }
    </script>
</body>
</html>
