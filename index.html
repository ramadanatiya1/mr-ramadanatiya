<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ رمضان عطية | عملاق الجغرافيا والتاريخ</title>
    <style>
        :root {
            --primary: #0b1120;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --input-bg: #0b1120;
            --input-border: #334155;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* ثيم الجغرافيا الديناميكي */
        body.geo-theme {
            --primary: #02233b;
            --secondary: #042e4d;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --bg: #011627;
            --card-bg: rgba(4, 39, 66, 0.85);
            --input-border: #0284c7;
        }

        /* ثيم التاريخ الديناميكي */
        body.history-theme {
            --primary: #23160a;
            --secondary: #3b240f;
            --accent: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.3);
            --bg: #140d05;
            --card-bg: rgba(43, 28, 12, 0.88);
            --input-border: #d97706;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
            transition: background 0.5s ease;
        }

        .container { max-width: 700px; margin: 0 auto; }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--accent);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px var(--accent-glow);
            margin-bottom: 20px;
        }

        h1, h2, h3 { color: var(--accent); margin-top: 0; text-align: center; }
        p { color: var(--text-muted); font-size: 14px; text-align: center; }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #fff;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .lesson-card {
            background: var(--secondary);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 14px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--accent);
            color: #000;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .hidden { display: none !important; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; }
    </style>
</head>
<body id="pageBody" class="geo-theme">

    <div class="container">

        <!-- شاشة تسجيل الدخول -->
        <div id="authSection" class="glass-card">
            <h2>تسجيل دخول الطالب</h2>
            <p>اختر مادتك وسجل بياناتك لدخول المنصة</p>
            <input type="text" id="userName" class="form-control" placeholder="اكتب اسمك الثلاثي...">
            <select id="userSubject" class="form-control">
                <option value="geo">الصف الثالث الثانوي - الجغرافيا السياسية 🌍</option>
                <option value="history">الصف الثالث الثانوي - التاريخ والحضارات 📜</option>
            </select>
            <button class="btn" onclick="login()">دخول المنصة 🚀</button>
        </div>

        <!-- الواجهة الرئيسية للمنصة -->
        <div id="mainPlatform" class="hidden">
            
            <div class="glass-card" style="text-align: center;">
                <span id="headerIcon" style="font-size: 40px;">🌍</span>
                <h1 id="platformTitle">منصة الأستاذ رمضان عطية</h1>
                <p>عملاق الجغرافيا السياسية والتاريخ للثانوية العامة والبكالوريا</p>
                
                <div class="user-info">
                    <span>مرحباً بك: <strong id="displayName" style="color:var(--accent);"></strong></span>
                    <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">تسجيل خروج 🚪</button>
                </div>
            </div>

            <!-- قائمة الدروس والمحتوى -->
            <div class="glass-card">
                <h3 id="sectionTitle">محتوى المنهج</h3>
                <div id="dynamicLessons">
                    <!-- يتم تعبئتها أوتوماتيكياً حسب المادة -->
                </div>
            </div>

            <!-- قسم الشحن وتفعيل الحصص -->
            <div class="glass-card">
                <h3>💳 شحن وتفعيل الحصص</h3>
                <p>أدخل كود الكارت المقدم من سنتر الأستاذ لتفعيل محتوى الحصص والامتحانات:</p>
                <input type="text" class="form-control" placeholder="أدخل كود الكارت هنا (مثال: RM-XXXX)...">
                <button class="btn" onclick="alert('جارِ التحقق من الكود وتفعيل الحصة...')">تفعيل كود الكارت الآن</button>
            </div>

        </div>

    </div>

    <script>
        function login() {
            const name = document.getElementById('userName').value.trim();
            const subject = document.getElementById('userSubject').value;

            if(!name) {
                alert('من فضلك اكتب اسمك الأول يا بطل!');
                return;
            }

            localStorage.setItem('rt_name', name);
            localStorage.setItem('rt_subject', subject);
            renderPlatform();
        }

        function renderPlatform() {
            const name = localStorage.getItem('rt_name');
            const subject = localStorage.getItem('rt_subject');

            if(!name) return;

            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainPlatform').classList.remove('hidden');
            document.getElementById('displayName').innerText = name;

            const body = document.getElementById('pageBody');
            const title = document.getElementById('platformTitle');
            const icon = document.getElementById('headerIcon');
            const sectionTitle = document.getElementById('sectionTitle');
            const lessonsContainer = document.getElementById('dynamicLessons');

            if(subject === 'geo') {
                body.className = 'geo-theme';
                icon.innerHTML = '🌍';
                title.innerText = 'منصة الجغرافيا السياسية';
                sectionTitle.innerText = 'محتوى منهج الجغرافيا السياسية';
                lessonsContainer.innerHTML = `
                    <div class="lesson-card"><span>الدرس التمهيدي: المدخل لدراسة الجغرافيا السياسية</span><span class="badge">فيديو + ملزمة</span></div>
                    <div class="lesson-card"><span>الوحدة الأولى: الدولة في الجغرافيا السياسية</span><span class="badge" style="background:#f59e0b">متاح للشحن</span></div>
                    <div class="lesson-card"><span>الوحدة الثانية: المشكلات السياسية</span><span class="badge" style="background:#64748b">قريباً</span></div>
                `;
            } else {
                body.className = 'history-theme';
                icon.innerHTML = '📜';
                title.innerText = 'منصة التاريخ والحضارات';
                sectionTitle.innerText = 'محتوى منهج التاريخ للثانوية العامة';
                lessonsContainer.innerHTML = `
                    <div class="lesson-card"><span>الحملة الفرنسية على مصر وبلاد الشام</span><span class="badge">فيديو + ملزمة</span></div>
                    <div class="lesson-card"><span>بناء الدولة الحديثة في مصر (عصر محمد علي)</span><span class="badge" style="background:#fbbf24">متاح للشحن</span></div>
                    <div class="lesson-card"><span>التوسع الاستعماري في البلاد العربية</span><span class="badge" style="background:#64748b">قريباً</span></div>
                `;
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        window.onload = function() {
            if(localStorage.getItem('rt_name')) {
                renderPlatform();
            }
        }
    </script>
</body>
</html>
